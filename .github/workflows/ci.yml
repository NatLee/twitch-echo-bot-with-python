name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            examples/requirements.txt

      - name: The bot needs only the standard library
        run: python -c "import main, twitch_chat, config, twitchSocket; print('imports fine without any packages')"

      - name: Install test tools
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests (against the fake Twitch server, never the real one)
        run: pytest -v
